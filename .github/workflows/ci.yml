name: GrantLynx CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Compact Smart Contract Compilation & Simulation Tests
  contract-tests:
    name: Compact Circuits & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Compact Compiler Toolchain
        run: |
          echo "Installing Midnight Compact compiler..."
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh || true
          if [ -f "$HOME/.local/bin/compact" ]; then
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          if [ -f "$HOME/.compact/bin/compact" ]; then
            echo "$HOME/.compact/bin" >> $GITHUB_PATH
          fi

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Compact Circuit Simulation Test Suite
        run: npm run test:contract

  # Job 2: Frontend Typecheck and Production Build
  frontend-build:
    name: Frontend Typecheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Static Verification
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Production Frontend Artifacts
        working-directory: ./frontend
        run: npm run build

      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grantlynx-dist
          path: frontend/dist
          retention-days: 7

  # Job 3: Automated Continuous Deployment Workflow
  deployment-workflow:
    name: Continuous Deployment & Verification
    needs: [contract-tests, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: grantlynx-dist
          path: dist

      - name: Validate Deployment Readiness
        run: |
          echo "Verifying production deployment bundle..."
          test -f dist/index.html || exit 1
          echo "✓ dist/index.html present"
          ls -la dist/assets/
          echo "GrantLynx production build verified and ready for deployment!"

