version: '3.8'

services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: grantlynx-proof-server
    ports:
      - "${PROOF_SERVER_PORT:-6300}:6300"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/health"]
      interval: 30s
      timeout: 10s
      retries: 3

